<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Prenda | !V4LAKKA</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@100;300;500&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="coleccion.html">Colección</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        
        <div class="logo-container">
            <a href="index.html" class="logo">!V4LAKKA</a>
        </div>
        
        <div class="navbar-spacer">
            <a href="#" id="cart-open" class="cart-btn-nav">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                CART [ <span id="cart-count">0</span> ]
            </a>
        </div>
    </header>

    <!-- SECCIÓN DE DETALLE DE PRODUCTO -->
    <main class="product-detail-container">
        <!-- Galería de Fotos -->
        <div class="product-gallery">
            <div class="main-image-wrapper">
                <img id="main-product-img" src="" alt="Prenda">
            </div>
            <div class="thumbnail-list" id="thumbnail-container">
                <!-- Las miniaturas se cargan con JS -->
            </div>
        </div>

        <!-- Información y Opciones -->
        <div class="product-details-info">
            <span id="product-stock-badge" class="stock-badge in-stock">STOCK DISPONIBLE</span>
            <h1 id="product-title">CARGANDO...</h1>
            <p id="product-price" class="detail-price">$ 0</p>
            <p id="product-description" class="detail-desc">Diseño exclusivo de alta densidad. Confección independiente en Mar del Plata.</p>
            
            <!-- Selector de Talles -->
            <div class="size-selector-container">
                <p>SELECCIONAR TALLE:</p>
                <div class="sizes-grid" id="sizes-grid">
                    <button class="size-btn" onclick="selectSize('S')">S</button>
                    <button class="size-btn active" onclick="selectSize('M')">M</button>
                    <button class="size-btn" onclick="selectSize('L')">L</button>
                    <button class="size-btn" onclick="selectSize('XL')">XL</button>
                </div>
            </div>

            <button id="btn-add-to-cart-detail" class="btn-primary-action">AGREGAR AL CARRITO</button>
        </div>
    </main>

    <footer id="contacto">
        <div class="footer-content">
            <p>MDQ / ARG</p>
            <p class="footer-social">IG / WA</p>
        </div>
    </footer>

    <!-- OVERLAY Y PANEL DEL CARRITO -->
    <div class="cart-overlay" id="cart-overlay"></div>
    <aside class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>TERMINAL_01 // CARRITO</h2>
            <button id="cart-close" class="close-btn">X</button>
        </div>
        
        <div class="cart-items" id="cart-items"></div>

        <div class="cart-footer">
            <div class="cart-total">
                <span>TOTAL</span>
                <span>$<span id="cart-total-price">0</span></span>
            </div>
            
            <form id="checkout-form" class="checkout-form">
                <div class="form-scroll-area">
                    <input type="text" id="cli-nombre" placeholder="NOMBRE COMPLETO" required>
                    <input type="email" id="cli-email" placeholder="CORREO ELECTRÓNICO" required>
                    <input type="tel" id="cli-telefono" placeholder="TELÉFONO" required>
                    <input type="text" id="cli-direccion" placeholder="DIRECCIÓN COMPLETA (CALLE Y ALTURA)" required>
                    <div class="form-row">
                        <input type="text" id="cli-provincia" placeholder="PROVINCIA" required>
                        <input type="text" id="cli-cp" placeholder="CÓDIGO POSTAL" required>
                    </div>
                    
                    <div class="payment-methods">
                        <p>MÉTODO DE PAGO:</p>
                        <label class="radio-label">
                            <input type="radio" name="metodo-pago" value="mercadopago" checked>
                            <span>MERCADO PAGO (Tarjetas / Dinero en cuenta)</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="metodo-pago" value="transferencia_bancaria">
                            <span>TRANSFERENCIA BANCARIA (10% OFF)</span>
                        </label>
                    </div>
                </div>
                <button type="submit" class="btn-checkout">PROCESAR ORDEN</button>
            </form>
        </div>
    </aside>

    <script src="main.js"></script>
</body>
</html>
